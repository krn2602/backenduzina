services:
  - type: web
    name: jobfest-api
    runtime: node
    plan: free
    branch: fix
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://kqixrnkgnoqbghhspakd.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: PGSSLROOTCERT
        value: certs/supabase-ca.crt
      - key: CV_BUCKET
        value: jobfest-cv
      - key: CV_STORAGE_LIMIT_MB
        value: "800"
      - key: CV_ACCESS_TOKEN
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: "https://duzina.servertheo.top,https://jobfest.servertheo.top,https://duzina.pages.dev"
